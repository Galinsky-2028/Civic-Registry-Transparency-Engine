services:
  - type: web
    name: civic-registry-demo
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/Galinsky-2028/Civic-Registry-Transparency-Engine
    branch: main
    buildCommand: npm install --global pnpm@12.7.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CIVIC_REGISTRY_ADMIN_SESSION_SECRET
        generateValue: true
      - key: CIVIC_REGISTRY_EDITOR_TOKEN
        generateValue: true
      - key: CIVIC_REGISTRY_REVIEWER_TOKEN
        generateValue: true
      - key: CIVIC_REGISTRY_PUBLISHER_TOKEN
        generateValue: true
      - key: CIVIC_REGISTRY_SEED_GENERIC
        value: "true"
      - key: CIVIC_REGISTRY_DEMO
        value: "true"
