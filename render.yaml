services:
  - type: web
    name: civic-registry-preview-v2
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/Galinsky-2028/Civic-Registry-Transparency-Engine
    branch: main
    buildCommand: npm install --global pnpm@12.7.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: civic-registry-db
          property: connectionString
      - key: CIVIC_REGISTRY_ADMIN_TOKEN
        generateValue: true
      - key: CIVIC_REGISTRY_SEED_GENERIC
        value: "true"
      - key: CIVIC_REGISTRY_DEMO
        value: "true"

databases:
  - name: civic-registry-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: civic_registry
    ipAllowList: []
